# The app's version, SemVer (MAJOR.MINOR.PATCH). The ONE place it is written.
#
# Android installs an update only over a LOWER versionCode, so the code is derived from this, never
# typed: MAJOR*1_000_000 + MINOR*1_000 + PATCH. 1.2.3 -> 1002003. Bump this before tagging; CI
# refuses a v* tag that does not match it.
VERSION=1.4.3
