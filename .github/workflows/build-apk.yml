name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the release on a version tag

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # The app reads bank SMS, so there is NO committed fallback key: an APK signed with a
          # public key could be installed over a seller's copy. Without the secret, only the debug
          # APK is built, and no release is published.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "HAS_KEY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 is not set — building the debug APK only."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEY" = "1" ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect APKs
        run: |
          mkdir -p output-apks
          cp app/build/outputs/apk/debug/app-debug.apk output-apks/JirjirakSMS-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            # One stable name, so the bot can link releases/latest/download/JirjirakSMS.apk.
            cp app/build/outputs/apk/release/app-release.apk output-apks/JirjirakSMS.apk
          fi
          ls -la output-apks/

      - uses: actions/upload-artifact@v4
        with:
          name: JirjirakSMS-APKs
          path: output-apks/
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == '1'
        uses: softprops/action-gh-release@v2
        with:
          name: جیرجیرک پیامک ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: output-apks/JirjirakSMS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
